<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EBS Scheduling</title>
  <link rel="stylesheet" href="style.css">
  <script>
    // Set the theme before the CSS applies, so a reload does not flash a white background
    document.documentElement.dataset.theme =
      localStorage.getItem("ebs.theme") ??
      (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  </script>
</head>
<!-- Static text carries data-i18n (text content) / data-i18n-title (the title attribute), and
     app.js swaps it all for the chosen language once it loads.
     The wording written here is only the fallback for when the JS never runs — it is not a
     second dictionary. The real content lives in js/i18n.js. -->
<body>
  <header>
    <h1 data-i18n="app.title">EBS Scheduling</h1>
    <span id="dir-status" data-i18n="app.dirNone">No data folder linked</span>
    <select id="lang-select" data-i18n-title="app.langLabel" title="Interface language"></select>
    <button id="theme-btn" data-i18n-title="app.themeToggle" title="Switch theme (light / gray / dark)">◐</button>
    <button id="settings-btn" data-i18n="app.settings">Settings</button>
    <button id="pick-dir" data-i18n="app.pickDir">Pick folder</button>
  </header>
  <main id="main"></main>
  <button id="collapse-all" data-i18n-title="app.collapseAll" title="Collapse all sections">⊟</button>
  <button id="refresh-btn" data-i18n-title="app.refresh" title="Refresh (re-read the folder)">⟳</button>
  <button id="to-top" data-i18n-title="app.toTop" title="Back to top" hidden>↑</button>
  <div id="toasts"></div>
  <script src="js/vendor/marked.min.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
