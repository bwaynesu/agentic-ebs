# Publish App/ to GitHub Pages.
#
# The site lives in App/, not at the repository root, so the default
# "deploy from a branch" setting cannot serve it. This workflow uploads that
# one directory as the Pages artifact instead. Set Settings > Pages > Source
# to "GitHub Actions" for it to take effect.
#
# The tests run first. They cannot exercise app.js, which needs a DOM, but they
# do cover every pure function and the CSS and prompt contracts — enough that a
# broken tree does not reach the published page.
name: Deploy App to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it: a half-published site
# is worse than a slightly stale one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run tests
        run: node --test "App/js/*.test.mjs"

      - name: Syntax-check app.js
        run: node --check App/js/app.js

      # version.json ships with an empty date and gets it here. Writing the date by hand would
      # mean remembering to change it on every release, and a date that disagrees with what is
      # actually served is worse than no date at all.
      # Node rather than jq: the job already installs Node above, so this step can be run and
      # checked locally instead of resting on what happens to be on the runner image.
      - name: Stamp the build date
        run: node -e "const fs=require('fs'),f='App/version.json',v=JSON.parse(fs.readFileSync(f,'utf8'));v.date=new Date().toISOString().slice(0,10);fs.writeFileSync(f,JSON.stringify(v,null,2)+'\n')"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: App

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
